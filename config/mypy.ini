# Settings for mypy, the type checker (optional tool for VS Code / Antigravity).
# Run from the project folder:  python -m mypy --config-file config/mypy.ini
[mypy]
# The project's own code is in src/, so "import everflavor" can be found
mypy_path = src
files = src/everflavor, tests
# Some libraries ship without type information; do not report them as errors
ignore_missing_imports = True
# Stricter checks that catch real bugs: check inside functions without type hints, code that
# can never run, comparisons that are always False, and ignore comments that are no longer needed
check_untyped_defs = True
warn_unreachable = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
