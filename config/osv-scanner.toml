# Known vulnerabilities the security workflow (osv-scanner) accepts for now, each with the reason and an end date:
# after ignoreUntil the scan fails again, so the decision is made again. Reviewed by Claude, 2026-10-27.
#
# chromadb 1.5.9 comes only through crewai (the meal planner). All four advisories are about Chroma running as a
# server (its HTTP API, tenants, authorisation providers). We never start a Chroma server, and crew.py builds the
# Crew without memory, so this code does not run in EverFlavor. No fixed version exists yet; Dependabot proposes one
# when it does.

[[IgnoredVulns]]
id = "PYSEC-2026-311"
ignoreUntil = 2026-12-31
reason = "Chroma server endpoint (pre-auth code injection); no Chroma server is run; transitive via crewai; no fix yet"

