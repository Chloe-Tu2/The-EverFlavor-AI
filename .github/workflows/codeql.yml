# CodeQL (free for public repos): GitHub's analysis of the Python code for security problems (injection, unsafe
# deserialisation, path traversal ...). Findings appear in the repo's Security tab, not as failed checks.
name: codeql

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"   # Mondays

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # to upload the findings to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
        with:
          languages: python
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d   # v4.38.3
        with:
          category: /language:python
