# Runs the project's checks on every push and pull request (docs/CONTRIBUTING.md, rule 2).
# No API keys are needed: the tests use small made-up tables, not downloaded data.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # A fixed version: ubuntu-latest moves to Ubuntu 26 on 2026-10-19, which could change the
    # checks without any change of ours. Upgrade on purpose, after a test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # the version Google Colab runs

      # uv installs the same requirement files as pip, much faster, with a cache between runs
      - uses: astral-sh/setup-uv@v10.3.0   # this action has no v10 tag: pin a release, upgrade on purpose
        with:
          enable-cache: true
          cache-dependency-glob: config/requirements*.txt

      - name: Install the libraries and checking tools
        run: uv pip install --system -r config/requirements-dev.txt

      - name: Tests and security checks
        run: python -m pytest tests

      - name: Ruff (mistakes and style)
        run: python -m ruff check src tests notebooks app

      - name: mypy (type hints)
        run: python -m mypy --config-file config/mypy.ini

      - name: PyMarkdown (Markdown formatting)
        run: python -m pymarkdown --config config/pymarkdown.json scan README.md docs app/README.md config/README.md data/README.md notebooks/README.md src/everflavor/README.md tests/README.md
